# Konfigurasi SEMENTARA (Hanya HTTP)
server {
    listen 80;
    server_name jtiport.my.id www.jtiport.my.id;

    root /var/www/html/public;
    index index.php index.html;

    # === Khusus untuk verifikasi Certbot (Let's Encrypt) ===
    location ~ /.well-known/acme-challenge {
        allow all;
        root /var/www/html/public;
    }

    resolver 127.0.0.11 valid=5s ipv6=off;

    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # === Storage (Upload Gambar) ===
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri $uri/ =404;
    }

    # === Static Assets ===
    location ~* \.(jpg|jpeg|png|gif|ico|woff2?|ttf|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # CSS & JS
    location ~* \.(css|js)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Fallback umum
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP Processing
    location ~ \.php$ {
        set $backend "jtiport_blue:9000";

        fastcgi_pass   $backend;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include        fastcgi_params;

        fastcgi_read_timeout    300;
        fastcgi_connect_timeout 60;
        fastcgi_send_timeout    300;

        fastcgi_buffer_size       128k;
        fastcgi_buffers           4 256k;
        fastcgi_busy_buffers_size 256k;

        fastcgi_param HTTP_X_REAL_IP $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;

        # NOTE: Comment atau hapus baris HTTPS 'on' sementara saat masih HTTP
        # fastcgi_param HTTPS 'on';
    }

    # Security
    location ~ /\.(ht|env|git) {
        deny all;
    }

    access_log /var/log/nginx/jtiport_access.log;
    error_log  /var/log/nginx/jtiport_error.log warn;
}
