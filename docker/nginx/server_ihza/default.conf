# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name masisza.my.id www.masisza.my.id;
    return 301 https://$host$request_uri;
}

# Main HTTPS Server
server {
    listen 443 ssl;
    server_name masisza.my.id www.masisza.my.id;

    root /var/www/html/public;
    index index.php index.html;

    # SSL Certbot
    ssl_certificate /etc/letsencrypt/live/masisza.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/masisza.my.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    resolver 127.0.0.11 valid=5s ipv6=off;

    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # === Storage (Upload Gambar) ===
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri $uri/ =404;
    }

    # === Static Assets - Lebih Longgar untuk Livewire ===
    location ~* \.(jpg|jpeg|png|gif|ico|woff2?|ttf|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # CSS & JS (PENTING untuk Livewire)
    location ~* \.(css|js)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Fallback umum
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP Processing
    location ~ \.php$ {
        set $backend "jtiport_blue:9000";

        fastcgi_pass   $backend;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include        fastcgi_params;

        fastcgi_read_timeout    300;
        fastcgi_connect_timeout 60;
        fastcgi_send_timeout    300;

        fastcgi_buffer_size       128k;
        fastcgi_buffers           4 256k;
        fastcgi_busy_buffers_size 256k;

        fastcgi_param HTTP_X_REAL_IP $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTPS 'on';
    }

    # Security
    location ~ /\.(ht|env|git) {
        deny all;
    }

    access_log /var/log/nginx/jtiport_access.log;
    error_log  /var/log/nginx/jtiport_error.log warn;
}
