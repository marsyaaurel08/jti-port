# =====================================================================
# Nginx Config - Jtiport Blue-Green [FIXED]
#
# FIX UTAMA:
#   - HAPUS upstream block statis. Upstream block me-resolve semua
#     hostname saat Nginx startup. Kalau container belum ada →
#     "host not found in upstream" → Nginx crash.
#
#   - GANTI dengan resolver + set $backend variable di dalam
#     location block. Dengan cara ini DNS di-resolve lazy (per
#     request), bukan saat startup. Nginx tidak crash walau container
#     belum ada — hanya return 502 untuk request tersebut.
#
# File ini adalah template awal. deploy.sh akan me-regenerate file
# ini setiap deployment dengan nama container yang aktif.
# =====================================================================

server {
    listen 80;
    server_name masisza.my.id www.masisza.my.id;
    root /var/www/html/public;
    index index.php index.html;

    # FIX: Resolver DNS internal Docker.
    # - 127.0.0.11 adalah DNS resolver Docker yang selalu tersedia.
    # - valid=5s: cache DNS 5 detik, cukup cepat untuk mendeteksi
    #   container baru tanpa membanjiri DNS server.
    # - ipv6=off: hindari resolve AAAA record yang tidak diperlukan.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Health check endpoint (untuk load balancer / monitoring)
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /storage/ {
        alias /var/www/html/storage/app/public/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
        # try_files $uri $uri/ =404;
    }

    # Static assets — cache langsung, jangan diteruskan ke PHP
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff2?|ttf|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri $uri/ /index.php?$query_string;
        # try_files $uri =404;
    }

    location ~ \.php$ {
        # FIX: Gunakan variable $backend agar DNS resolve terjadi
        # per-request (lazy), bukan saat Nginx startup.
        #
        # PENTING: Tanpa "set $backend", menulis:
        #   fastcgi_pass jtiport_blue:9000;
        # akan membuat Nginx resolve DNS saat startup dan crash
        # jika container belum ada.
        #
        # Nilai variable ini di-overwrite oleh deploy.sh setiap
        # deployment — tidak perlu diubah manual.
        set $backend "jtiport_blue:9000";

        fastcgi_pass   $backend;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include        fastcgi_params;

        fastcgi_read_timeout    300;
        fastcgi_connect_timeout 60;
        fastcgi_send_timeout    300;

        # Buffer settings
        fastcgi_buffer_size          128k;
        fastcgi_buffers              4 256k;
        fastcgi_busy_buffers_size    256k;

        # Pass real client IP ke PHP
        fastcgi_param HTTP_X_REAL_IP    $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param  HTTPS 'on';
    }

    # Blokir akses ke file sensitif
    location ~ /\.(ht|env|git) {
        deny all;
    }

    # Logging
    access_log /var/log/nginx/jtiport_access.log;
    error_log  /var/log/nginx/jtiport_error.log warn;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/masisza.my.id/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/masisza.my.id/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.masisza.my.id) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = masisza.my.id) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name masisza.my.id www.masisza.my.id;
    return 404; # managed by Certbot
}
