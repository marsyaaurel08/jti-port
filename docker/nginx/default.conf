upstream laravel_backend {
    # Pastikan nama sesuai dengan nama SERVICE di docker-compose
    server app_blue:9000 max_fails=3 fail_timeout=30s;
    server app_green:9000 down;
}

server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php index.html;

    # Tambahkan resolver DNS internal Docker agar dynamic upstream jalan
    resolver 127.0.0.11 valid=5s;

    location /health {
        access_log off;
        return 200 "healthy\n";
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Menggunakan variabel agar Nginx tidak mengecek host saat startup
        set $upstream_app laravel_backend;

        fastcgi_pass $upstream_app;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }
}
