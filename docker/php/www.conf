; =====================================================================
; PHP-FPM Pool Config - Jtiport
; =====================================================================

[www]

user  = www-data
group = www-data

; Listen pada socket TCP (bukan unix socket) agar bisa diakses
; dari container Nginx yang berbeda via Docker network
listen = 0.0.0.0:9000

; --- Process manager ---
; dynamic: spawn worker sesuai kebutuhan, hemat memory di VPS kecil
pm = dynamic
pm.max_children      = 20
pm.start_servers     = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests      = 500

; --- Timeouts ---
request_terminate_timeout = 120s

; --- Logging ---
access.log  = /proc/self/fd/2
slowlog     = /var/log/php-fpm-slow.log
request_slowlog_timeout = 10s

; --- Environment: teruskan env vars dari container ke PHP ---
clear_env = no

; --- Status page (untuk monitoring internal) ---
pm.status_path = /fpm-status
ping.path      = /fpm-ping