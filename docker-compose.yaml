version: '3.8'

services:

  # ==================== SERVICE PHP (Laravel App) ====================
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: jtiport_app
    restart: unless-stopped
    working_dir: /var/www/html

    # Mount kode project agar perubahan langsung terlihat
    volumes:
      - .:/var/www/html

    networks:
      - jtiport_network

    depends_on:
      - db
      - redis


  # ==================== SERVICE NGINX (Web Server) ====================
  nginx:
    image: nginx:alpine
    container_name: jtiport_nginx
    restart: unless-stopped

    # Akses aplikasi di browser: http://localhost:8000
    ports:
      - "8000:80"

    volumes:
      - .:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

    networks:
      - jtiport_network

    depends_on:
      - app


  # ==================== SERVICE DATABASE (MySQL) ====================
  db:
    image: mysql:8.0
    container_name: jtiport_mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: jtiport          # Nama database sesuai project
      MYSQL_USER: jtiport
      MYSQL_PASSWORD: password

    volumes:
      - jtiport_dbdata:/var/lib/mysql   # Volume khusus untuk project ini

    # Port MySQL (bisa diakses dari host jika perlu)
    ports:
      - "3307:3306"

    networks:
      - jtiport_network


  # ==================== SERVICE REDIS ====================
  redis:
    image: redis:alpine
    container_name: jtiport_redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    networks:
      - jtiport_network


# ==================== NETWORK ====================
networks:
  jtiport_network:
    driver: bridge


# ==================== VOLUME ====================
volumes:
  jtiport_dbdata:     # Volume database khusus untuk project jtiport
