version: "3.8"

services:
  nginx:
    image: nginx:alpine
    container_name: jtiport_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - "./docker/nginx:/etc/nginx/conf.d"
    networks:
      - jtiport_network
    depends_on:
      - app_blue

  app_blue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: jtiport_blue
    restart: unless-stopped
    volumes:
      - "app_storage:/var/www/html/storage" # Named volume lebih aman
    environment:
      - LARAVEL_ENV_ENCRYPTION_KEY=${LARAVEL_ENV_ENCRYPTION_KEY}
      - APP_ENV=${APP_ENV:-production}
    networks:
      - jtiport_network
    depends_on:
      - db
      - redis

  app_green:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: jtiport_green
    restart: unless-stopped
    volumes:
      - "app_storage:/var/www/html/storage"
    environment:
      - LARAVEL_ENV_ENCRYPTION_KEY=${LARAVEL_ENV_ENCRYPTION_KEY}
      - APP_ENV=${APP_ENV:-production}
    networks:
      - jtiport_network
    depends_on:
      - db
      - redis

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: jtiport_worker
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600 --timeout=90
    environment:
      - LARAVEL_ENV_ENCRYPTION_KEY=${LARAVEL_ENV_ENCRYPTION_KEY}
      - APP_ENV=${APP_ENV:-production}
    volumes:
      - "app_storage:/var/www/html/storage"
    networks:
      - jtiport_network
    depends_on:
      - db
      - redis

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: jtiport_scheduler
    restart: unless-stopped
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    environment:
      - LARAVEL_ENV_ENCRYPTION_KEY=${LARAVEL_ENV_ENCRYPTION_KEY}
      - APP_ENV=${APP_ENV:-production}
    volumes:
      - "app_storage:/var/www/html/storage"
    networks:
      - jtiport_network
    depends_on:
      - db
      - redis

  db:
    image: mysql:8.0
    container_name: jtiport_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-jtiport}
      MYSQL_USER: ${DB_USERNAME:-jtiport_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-jtiport_pass}
    volumes:
      - jtiport_dbdata:/var/lib/mysql
    networks:
      - jtiport_network
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-p${DB_PASSWORD:-root}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: jtiport_redis
    restart: unless-stopped
    networks:
      - jtiport_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  jtiport_network:
    driver: bridge

volumes:
  jtiport_dbdata:
  app_storage:
