version: "3.8"

services:
  nginx:
    image: nginx:alpine
    container_name: jtiport_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - "./docker/nginx:/etc/nginx/conf.d"
    networks:
      - jtiport_network
    depends_on:
      - jtiport_blue # Minimal satu harus ada agar Nginx tidak crash saat startup awal

  jtiport_blue:
    image: ${DOCKER_HUB_USERNAME}/jtiport:latest
    container_name: jtiport_blue
    restart: unless-stopped
    volumes:
      - "app_storage:/var/www/html/storage"
    environment:
      - LARAVEL_ENV_ENCRYPTION_KEY=${LARAVEL_ENV_ENCRYPTION_KEY}
      - APP_ENV=${APP_ENV:-production}
    networks:
      - jtiport_network

  jtiport_green:
    image: ${DOCKER_HUB_USERNAME}/jtiport:latest
    container_name: jtiport_green
    restart: unless-stopped
    volumes:
      - "app_storage:/var/www/html/storage"
    environment:
      - LARAVEL_ENV_ENCRYPTION_KEY=${LARAVEL_ENV_ENCRYPTION_KEY}
      - APP_ENV=${APP_ENV:-production}
    networks:
      - jtiport_network

  worker:
    image: ${DOCKER_HUB_USERNAME}/jtiport:latest
    container_name: jtiport_worker
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3
    environment:
      - LARAVEL_ENV_ENCRYPTION_KEY=${LARAVEL_ENV_ENCRYPTION_KEY}
    volumes:
      - "app_storage:/var/www/html/storage"
    networks:
      - jtiport_network
    depends_on:
      - db
      - redis

  db:
    image: mysql:8.0
    container_name: jtiport_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-jtiport}
    volumes:
      - jtiport_dbdata:/var/lib/mysql
    networks:
      - jtiport_network

  redis:
    image: redis:alpine
    container_name: jtiport_redis
    networks:
      - jtiport_network

networks:
  jtiport_network:
    name: jtiport_network # Mengunci nama agar tidak otomatis diberi prefix oleh docker-compose
    driver: bridge

volumes:
  jtiport_dbdata:
  app_storage:
