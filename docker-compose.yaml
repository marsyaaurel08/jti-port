services:
  # Polisi lalu lintas
  nginx:
    image: nginx:alpine
    container_name: jtiport_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - "./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf"
      - ".:/var/www/html"
    networks:
      - jtiport_network

  # Database
  db:
    image: mysql:8.0
    container_name: jtiport_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: jtiport
    volumes:
      - jtiport_dbdata:/var/lib/mysql
    networks:
      - jtiport_network

  # Cache
  redis:
    image: redis:alpine
    container_name: jtiport_redis
    networks:
      - jtiport_network
  
networks:
  jtiport_network:
    driver: bridge

volumes:
  jtiport_dbdata:
