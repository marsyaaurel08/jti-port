name: CI/CD JTIport

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ====================================================================
  # JOB 1: BUILD & PUSH IMAGE
  # ====================================================================
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # FIX UTAMA: Strip CRLF SEBELUM build.
      # Harus di sini — bukan di Dockerfile dan bukan di deploy job.
      # Alasannya:
      #   - Di Dockerfile: kalau layer ter-cache, RUN sed tidak dieksekusi
      #     ulang sehingga CRLF dari build sebelumnya bisa lolos.
      #   - Di deploy job: terlambat, file sudah masuk image saat build.
      #   - Di sini (sebelum build): file yang di-COPY ke image sudah LF.
      - name: Strip Windows line endings (CRLF -> LF)
        run: |
          sed -i 's/\r//' docker-entrypoint.sh deploy.sh rollback.sh
          if grep -qP '\r' docker-entrypoint.sh; then
            echo "docker-entrypoint.sh masih mengandung CRLF setelah strip!"
            exit 1
          fi
          echo "Line endings OK"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/php/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/jtiport:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/jtiport:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/jtiport:latest
          cache-to: type=inline

  # ====================================================================
  # JOB 2: DEPLOY TO PRODUCTION
  # ====================================================================
  deploy-production:
    name: Deploy to Production
    needs: build-and-push
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Repair workspace permissions (self-hosted)
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" || true
          fi
          chmod -R u+rwX "$GITHUB_WORKSPACE" || true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}" | \
            docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin

      - name: Pull Image
        run: |
          docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/jtiport:${{ github.sha }}

      - name: Fix permissions
        run: chmod +x deploy.sh rollback.sh

      - name: Decrypt Environment File
        run: |
          # 1. Jalankan composer install sementara untuk mendapatkan vendor
          # Kita gunakan --no-scripts agar tidak menjalankan command yang butuh .env
          docker run --rm \
            -v ${{ github.workspace }}:/app \
            -w /app \
            composer:latest \
            composer install --no-interaction --no-scripts --no-autoloader

          # 2. Jalankan dekripsi sekarang setelah vendor tersedia
          docker run --rm \
            -v ${{ github.workspace }}:/app \
            -w /app \
            php:8.2-cli-alpine \
            sh -c "php artisan env:decrypt --key='${{ secrets.LARAVEL_ENV_ENCRYPTION_KEY }}' --env=production --force && mv .env.production .env"
      - name: Deploy to Production
        env:
          LARAVEL_ENV_ENCRYPTION_KEY: ${{ secrets.LARAVEL_ENV_ENCRYPTION_KEY }}
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          APP_ENV: production
        run: ./deploy.sh ${{ github.sha }}

      - name: Smoke Test
        run: |
          sleep 3
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health || echo "000")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "Smoke test passed (HTTP $HTTP_STATUS)"
          else
            echo "Smoke test failed (HTTP $HTTP_STATUS) - triggering rollback"
            DOCKER_HUB_USERNAME=${{ secrets.DOCKER_HUB_USERNAME }} \
            LARAVEL_ENV_ENCRYPTION_KEY=${{ secrets.LARAVEL_ENV_ENCRYPTION_KEY }} \
            ./rollback.sh
            exit 1
          fi

      - name: Notify Success
        if: success()
        run: |
          curl -s -X POST -H "Content-Type: application/json" \
            -d '{"text":"✅ *JTIport* deployed\nCommit: `${{ github.sha }}`\nBy: ${{ github.actor }}"}' \
            ${{ secrets.SLACK_WEBHOOK_URL }} || true

      - name: Notify Failure
        if: failure()
        run: |
          curl -s -X POST -H "Content-Type: application/json" \
            -d '{"text":"❌ *JTIport* deployment FAILED\nCommit: `${{ github.sha }}`\nCheck: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
            ${{ secrets.SLACK_WEBHOOK_URL }} || true
