name: CI/CD JTIport

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ====================================================================
  # JOB 1: BUILD & PUSH IMAGE
  # ====================================================================
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # FIX: Build & push dalam satu step menggunakan docker/build-push-action
      # agar memanfaatkan layer cache dari Docker Hub.
      - name: Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/php/Dockerfile
          push: true
          # Tag dengan SHA untuk traceability + latest untuk fallback
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/jtiport:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/jtiport:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/jtiport:latest
          cache-to: type=inline

  # ====================================================================
  # JOB 2: DEPLOY TO PRODUCTION
  # FIX: Pisah job build dan deploy agar kalau deploy gagal,
  #      image sudah terlanjur push dan bisa di-rollback manual.
  # ====================================================================
  deploy-production:
    name: Deploy to Production
    needs: build-and-push
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}" | \
            docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin

      # FIX: Pull image dengan SHA spesifik sebelum deploy
      # agar deploy.sh tidak perlu pull ulang (lebih cepat, lebih deterministic)
      - name: Pull Image
        run: |
          docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/jtiport:${{ github.sha }}

      - name: Make scripts executable
        run: chmod +x deploy.sh rollback.sh docker-entrypoint.sh

      - name: Deploy to Production
        env:
          LARAVEL_ENV_ENCRYPTION_KEY: ${{ secrets.LARAVEL_ENV_ENCRYPTION_KEY }}
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          APP_ENV: production
        # FIX: Kirim SHA sebagai IMAGE_TAG agar deploy.sh menggunakan
        # image yang tepat, bukan "latest" yang bisa berubah.
        run: ./deploy.sh ${{ github.sha }}

      # FIX: Tambah smoke test setelah deploy untuk verifikasi
      - name: Smoke Test
        run: |
          echo "🔍 Running smoke test..."
          sleep 3
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health || echo "000")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Smoke test passed (HTTP $HTTP_STATUS)"
          else
            echo "❌ Smoke test failed (HTTP $HTTP_STATUS)"
            echo "🔄 Triggering rollback..."
            DOCKER_HUB_USERNAME=${{ secrets.DOCKER_HUB_USERNAME }} \
            LARAVEL_ENV_ENCRYPTION_KEY=${{ secrets.LARAVEL_ENV_ENCRYPTION_KEY }} \
            ./rollback.sh
            exit 1
          fi

      - name: Notify Success
        if: success()
        run: |
          curl -s -X POST -H "Content-Type: application/json" \
            -d '{
              "text": "✅ *JTIport* deployed to production\nCommit: `${{ github.sha }}`\nBy: ${{ github.actor }}"
            }' \
            ${{ secrets.SLACK_WEBHOOK_URL }} || true

      - name: Notify Failure
        if: failure()
        run: |
          curl -s -X POST -H "Content-Type: application/json" \
            -d '{
              "text": "❌ *JTIport* deployment FAILED\nCommit: `${{ github.sha }}`\nBy: ${{ github.actor }}\nCheck: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }' \
            ${{ secrets.SLACK_WEBHOOK_URL }} || true
