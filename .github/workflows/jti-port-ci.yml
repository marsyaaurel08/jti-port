name: CI/CD JTIport

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ====================================================================
  # JOB 1: BUILD & PUSH IMAGE
  # ====================================================================
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Strip Windows line endings (CRLF -> LF)
        run: |
          sed -i 's/\r//' docker-entrypoint.sh deploy.sh rollback.sh
          if grep -qP '\r' docker-entrypoint.sh; then
            echo "docker-entrypoint.sh masih mengandung CRLF setelah strip!"
            exit 1
          fi
          echo "Line endings OK"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/php/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/jtiport:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/jtiport:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/jtiport:latest
          cache-to: type=inline

  # ====================================================================
  # JOB 2: DEPLOY TO PRODUCTION (2 Servers)
  # ====================================================================
  deploy-production:
    name: Deploy to Production
    needs: build-and-push
    runs-on: [self-hosted, "${{ matrix.server }}"]
    if: github.ref == 'refs/heads/main'
    environment: production
    strategy:
      matrix:
        include:
          - server: server-ihza
            nginx_config: server_ihza          # ← konfigurasi nginx untuk server ini
          - server: server-jti           # ganti dengan label runner kamu
            nginx_config: server_jti          # ← konfigurasi nginx untuk server ini

    steps:
      - name: Repair workspace permissions (self-hosted)
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" || true
          fi
          chmod -R u+rwX "$GITHUB_WORKSPACE" || true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}" | \
            docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin

      - name: Pull Image
        run: |
          docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/jtiport:${{ github.sha }}

      - name: Fix permissions
        run: chmod +x deploy.sh rollback.sh decrypt.sh encrypt.sh

      - name: Decrypt Environment File
        run: |
          ./decrypt.sh .env.production.enc '${{ secrets.LARAVEL_ENV_ENCRYPTION_KEY }}' .env

      - name: Deploy to Production
        env:
          LARAVEL_ENV_ENCRYPTION_KEY: ${{ secrets.LARAVEL_ENV_ENCRYPTION_KEY }}
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          APP_ENV: production
          NGINX_CONFIG_DIR: ${{ matrix.nginx_config }}
        run: ./deploy.sh ${{ github.sha }} ${{ matrix.server }}

      - name: Smoke Test
        run: |
          sleep 3
          HTTP_STATUS=$(curl -k -L -s -o /dev/null -w "%{http_code}" http://localhost/health || echo "000")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "Smoke test passed (HTTP $HTTP_STATUS)"
          else
            echo "Smoke test failed (HTTP $HTTP_STATUS) - triggering rollback"
            DOCKER_HUB_USERNAME=${{ secrets.DOCKER_HUB_USERNAME }} \
            LARAVEL_ENV_ENCRYPTION_KEY=${{ secrets.LARAVEL_ENV_ENCRYPTION_KEY }} \
            ./rollback.sh
            exit 1
          fi

      - name: Notify Success
        if: success()
        run: |
          curl -s -X POST -H "Content-Type: application/json" \
            -d '{"text":"✅ *JTIport* deployed successfully\nServer: ${{ matrix.server }}\nConfig: ${{ matrix.nginx_config }}\nCommit: `${{ github.sha }}`\nBy: ${{ github.actor }}"}' \
            ${{ secrets.SLACK_WEBHOOK_URL }} || true

      - name: Notify Failure
        if: failure()
        run: |
          curl -s -X POST -H "Content-Type: application/json" \
            -d '{"text":"❌ *JTIport* deployment FAILED\nServer: ${{ matrix.server }}\nCommit: `${{ github.sha }}`\nCheck: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
            ${{ secrets.SLACK_WEBHOOK_URL }} || true
            ${{ secrets.SLACK_WEBHOOK_URL }} || true
